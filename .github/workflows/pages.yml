name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Chamado pela coleta diaria: um commit feito com o GITHUB_TOKEN nao dispara
  # outros workflows, entao o deploy precisa acontecer dentro do mesmo run.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez, sem cancelar o que ja esta no ar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Sempre o topo da branch, e nao o SHA que disparou o run: quando a
          # coleta chama este workflow, o cardapio novo ja foi commitado depois.
          ref: ${{ github.ref_name }}

      - uses: actions/configure-pages@v5

      # O site nao tem passo de build: os arquivos vao como estao. Publicamos a
      # raiz para que qualquer arquivo novo da interface entre sem precisar
      # lembrar de listar aqui.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
